<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="friendsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122747"/>
      <stop offset="1" stop-color="#0B1E3D"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#friendsBg)"/>

  <!-- confetti -->
  <g fill="#C9A227">
    <rect x="40" y="60" width="6" height="6" transform="rotate(20 43 63)"/>
    <rect x="230" y="90" width="6" height="6" transform="rotate(-15 233 93)"/>
    <rect x="90" y="40" width="6" height="6" transform="rotate(45 93 43)"/>
    <rect x="200" y="50" width="6" height="6" transform="rotate(10 203 53)"/>
    <circle cx="70" cy="110" r="3.5"/>
    <circle cx="255" cy="140" r="3"/>
    <circle cx="150" cy="36" r="3"/>
  </g>
  <g fill="#E3C567" opacity="0.85">
    <rect x="130" y="70" width="6" height="6" transform="rotate(30 133 73)"/>
    <circle cx="30" cy="150" r="3"/>
    <rect x="180" y="110" width="6" height="6" transform="rotate(-30 183 113)"/>
  </g>

  <!-- three graduate silhouettes, arms up, caps thrown -->
  <g>
    <!-- left figure -->
    <g transform="translate(90,250)">
      <path d="M0 0 C -8 -18, -20 -30, -34 -46" stroke="#C9A227" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0 4 C 8 -14, 20 -26, 32 -42" stroke="#C9A227" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="6" rx="16" ry="10" fill="#1b3157"/>
      <rect x="-16" y="6" width="32" height="86" rx="12" fill="#1b3157" stroke="#C9A227" stroke-width="2"/>
      <circle cx="0" cy="-14" r="15" fill="#e6d4ab"/>
      <polygon points="-34,-52 34,-52 0,-70" fill="#0B1E3D" stroke="#C9A227" stroke-width="2"/>
    </g>

    <!-- middle figure (taller/front) -->
    <g transform="translate(150,236)">
      <path d="M0 0 C -10 -22, -24 -36, -40 -54" stroke="#E3C567" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C 10 -22, 24 -36, 40 -54" stroke="#E3C567" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <rect x="-19" y="6" width="38" height="104" rx="14" fill="#16294a" stroke="#E3C567" stroke-width="2.4"/>
      <circle cx="0" cy="-18" r="17" fill="#e6d4ab"/>
      <polygon points="-40,-58 40,-58 0,-78" fill="#0B1E3D" stroke="#E3C567" stroke-width="2.4"/>
    </g>

    <!-- right figure -->
    <g transform="translate(210,254)">
      <path d="M0 0 C 8 -18, 20 -30, 34 -46" stroke="#C9A227" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0 4 C -8 -14, -20 -26, -32 -42" stroke="#C9A227" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="-16" y="6" width="32" height="82" rx="12" fill="#1b3157" stroke="#C9A227" stroke-width="2"/>
      <circle cx="0" cy="-14" r="15" fill="#e6d4ab"/>
      <polygon points="-34,-52 34,-52 0,-70" fill="#0B1E3D" stroke="#C9A227" stroke-width="2"/>
    </g>
  </g>

  <!-- ground line -->
  <line x1="0" y1="346" x2="300" y2="346" stroke="#C9A227" stroke-width="1.5" opacity="0.35"/>

  <line x1="0" y1="392" x2="300" y2="392" stroke="#C9A227" stroke-width="2" opacity="0.7"/>
</svg>
