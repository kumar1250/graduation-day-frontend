<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="campusSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#0B1E3D"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#campusSky)"/>

  <!-- sun/emblem glow -->
  <circle cx="150" cy="90" r="34" fill="#E3C567" opacity="0.18"/>

  <!-- ground -->
  <rect x="0" y="330" width="300" height="70" fill="#0A1730"/>
  <rect x="0" y="330" width="300" height="6" fill="#C9A227" opacity="0.5"/>

  <!-- steps -->
  <polygon points="30,330 270,330 258,314 42,314" fill="#1b3157"/>
  <polygon points="42,314 258,314 248,300 52,300" fill="#20396440"/>

  <!-- building body -->
  <rect x="52" y="150" width="196" height="150" fill="#16294a" stroke="#C9A227" stroke-width="2"/>

  <!-- pediment / roof triangle -->
  <polygon points="150,90 250,150 50,150" fill="#1b3157" stroke="#C9A227" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="150" cy="118" r="9" fill="#C9A227"/>

  <!-- columns -->
  <g fill="#0B1E3D" stroke="#C9A227" stroke-width="1.6">
    <rect x="66" y="150" width="14" height="150"/>
    <rect x="106" y="150" width="14" height="150"/>
    <rect x="143" y="150" width="14" height="150"/>
    <rect x="180" y="150" width="14" height="150"/>
    <rect x="220" y="150" width="14" height="150"/>
  </g>
  <rect x="52" y="146" width="196" height="8" fill="#C9A227"/>

  <!-- entrance door -->
  <rect x="136" y="256" width="28" height="44" fill="#0A1730" stroke="#C9A227" stroke-width="1.6"/>

  <!-- clock -->
  <circle cx="150" cy="120" r="1" fill="none"/>

  <line x1="0" y1="392" x2="300" y2="392" stroke="#C9A227" stroke-width="2" opacity="0.7"/>
</svg>
