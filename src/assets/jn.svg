<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1E3D"/>
      <stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#E3C567" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E3C567" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3157"/>
      <stop offset="1" stop-color="#0B1E3D"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#stageBg)"/>

  <!-- curtains -->
  <g opacity="0.85">
    <path d="M0 0 H36 C 30 90, 44 200, 18 400 H0 Z" fill="#16294a"/>
    <path d="M300 0 H264 C 270 90, 256 200, 282 400 H300 Z" fill="#16294a"/>
    <path d="M36 0 H58 C 54 100, 62 220, 46 400 H30 C 44 210, 30 90, 36 0 Z" fill="#1b3157" opacity="0.7"/>
    <path d="M264 0 H242 C 246 100, 238 220, 254 400 H270 C 256 210, 270 90, 264 0 Z" fill="#1b3157" opacity="0.7"/>
  </g>

  <!-- spotlight beam -->
  <polygon points="150,18 90,300 210,300" fill="url(#beam)"/>

  <!-- stage floor -->
  <polygon points="20,330 280,330 300,400 0,400" fill="url(#floor)"/>
  <line x1="20" y1="330" x2="280" y2="330" stroke="#C9A227" stroke-width="2" opacity="0.6"/>

  <!-- podium -->
  <g transform="translate(150,300)">
    <polygon points="-28,64 28,64 20,10 -20,10" fill="#1f3a63" stroke="#C9A227" stroke-width="2"/>
    <rect x="-22" y="0" width="44" height="12" rx="2" fill="#16294a" stroke="#C9A227" stroke-width="1.6"/>
    <circle cx="0" cy="-10" r="6" fill="#C9A227"/>
    <text x="0" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C9A227" font-weight="600">BVCE</text>
  </g>

  <!-- mic -->
  <g transform="translate(150,246)">
    <line x1="0" y1="0" x2="0" y2="44" stroke="#E3C567" stroke-width="2"/>
    <ellipse cx="0" cy="-6" rx="6" ry="9" fill="#E3C567"/>
  </g>

  <line x1="0" y1="392" x2="300" y2="392" stroke="#C9A227" stroke-width="2" opacity="0.7"/>
</svg>
